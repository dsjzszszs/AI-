<style>
:root{
  --bg:#f7fcff; --panel:rgba(255,255,255,.86);
  --line:rgba(14,165,233,.18);
  --blue:#0284c7; --green:#059669;
  --text:#0b2a44; --muted:#4d6b85;

}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font); line-height:1.75; overflow-x:hidden;
}
.bg-grid{
  position:fixed; inset:0; z-index:-2; pointer-events:none;
  background-image:
    linear-gradient(rgba(14,165,233,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(14,165,233,.09) 1px,transparent 1px);

  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 40%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 40%,transparent 100%);
}
.bg-glow{position:fixed; z-index:-3; pointer-events:none; border-radius:50%; filter:blur(110px); opacity:.6}
.g1{width:520px;height:520px;top:-160px;left:-120px;background:radial-gradient(circle,#7dd3fc77,transparent 70%)}
.g2{width:460px;height:460px;top:8%;right:-160px;background:radial-gradient(circle,#6ee7b766,transparent 70%)}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none}

.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
section{position:relative;padding:70px 0}

nav{
  position:fixed;top:0;left:0;right:0;z-index:50;
  background:rgba(255,255,255,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.nav-in{max-width:1040px;margin:0 auto;padding:0 22px;height:62px;display:flex;align-items:center;justify-content:flex-end}
.nav-links{display:flex;gap:26px}
.nav-links a{color:var(--muted);text-decoration:none;font-size:14.5px;transition:color .2s}
.nav-links a:hover{color:var(--blue)}
.nav-links a.active{color:var(--blue);font-weight:700}

.page-head{padding:130px 0 20px}
.page-head .title{font-size:clamp(28px,4vw,38px);font-weight:700;letter-spacing:.03em;
  background:linear-gradient(90deg,#0b2a44,#0284c7 45%,#059669);-webkit-background-clip:text;background-clip:text;color:transparent}

.block-title{font-size:clamp(20px,2.6vw,26px);font-weight:700;color:#0b2a44;display:flex;align-items:center;gap:12px;margin-bottom:6px}
.block-title .num{
  min-width:34px;height:34px;padding:0 8px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;font-size:16px;
}
.block-sub{color:var(--muted);font-size:14px;margin-bottom:24px}

.site-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.site-card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(2,132,199,.05);
  transition:transform .25s,border-color .25s,box-shadow .25s;
}
.site-card:hover{transform:translateY(-4px);border-color:rgba(2,132,199,.42);box-shadow:0 14px 34px rgba(2,132,199,.12)}
.site-shot{display:block;height:300px;overflow:hidden;border-bottom:1px solid var(--line)}
.site-shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .45s ease}
.site-card:hover .site-shot img{transform:scale(1.02)}
.site-body{padding:16px 20px 20px}
.site-body h3{font-size:16px;color:#0b2a44;margin-bottom:5px}
.site-body a{color:var(--green);font-size:13.5px;text-decoration:none;word-break:break-all}
.site-body a:hover{text-decoration:underline}

.part-title{font-size:17px;font-weight:700;color:#0b2a44;margin:40px 0 18px;display:flex;align-items:center;gap:10px}
.part-title .pnum{
  width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;font-size:13px;
}
.workflow-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.workflow-card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(2,132,199,.05);

}
.workflow-card:hover{transform:translateY(-4px);border-color:rgba(2,132,199,.42);box-shadow:0 14px 34px rgba(2,132,199,.12)}
.workflow-card .shot{height:280px;overflow:hidden;border-bottom:1px solid var(--line)}
.workflow-card .shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.workflow-card .name{padding:14px 20px;font-size:15px;font-weight:600;color:#0b2a44}

.video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.video-card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(2,132,199,.05);
  transition:transform .25s,border-color .25s,box-shadow .25s;
}
.video-card:hover{transform:translateY(-4px);border-color:rgba(2,132,199,.42);box-shadow:0 14px 34px rgba(2,132,199,.12)}
.video-card video{width:100%;display:block;background:#0b2a44;aspect-ratio:9/16;object-fit:contain}
.video-card .name{padding:14px 20px;font-size:15px;font-weight:600;color:#0b2a44}

.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.img-card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(2,132,199,.05);
  transition:transform .25s,border-color .25s,box-shadow .25s;

.img-card:hover{transform:translateY(-4px);border-color:rgba(2,132,199,.42);box-shadow:0 14px 34px rgba(2,132,199,.12)}
.img-card .shot{height:280px;overflow:hidden}
.img-card img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}

footer{border-top:1px solid var(--line);padding:30px 0;text-align:center;color:var(--muted);font-size:13px}

.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.reveal.on{opacity:1;transform:none}

@media(max-width:820px){

  .img-card .shot{height:220px}
  .nav-links{display:none}
}
</style>

<script>
// 星空粒子
var cv=document.getElementById('stars'),ctx=cv.getContext('2d'),ps=[];
function size(){cv.width=innerWidth;cv.height=innerHeight}
size();addEventListener('resize',size);
var N=Math.min(80,Math.floor(innerWidth/16));
for(var i=0;i<N;i++){
  ps.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    r:Math.random()*1.3+.3,s:Math.random()*.25+.06,
    c:Math.random()>.5?'2,132,199':'5,150,105'});
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  for(var i=0;i<ps.length;i++){
    var p=ps[i];
    p.y-=p.s;if(p.y<-4){p.y=cv.height+4;p.x=Math.random()*cv.width}
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);
    ctx.fillStyle='rgba('+p.c+',.6)';ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();

// 滚动显现
var io=new IntersectionObserver(function(es){
  es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}});
},{threshold:.12});
document.querySelectorAll('.reveal').forEach(function(x){io.observe(x)});
</script>
